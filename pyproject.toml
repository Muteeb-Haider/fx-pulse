[project]
name = "fx-pulse"
version = "0.1.0"
description = "FX transparency pipeline: crypto market data from Revolut X and cross-border transfer quotes from Wise, normalized into Postgres for spread/cost analytics."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
fxpulse = "fxpulse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Descriptive test names + inline fixture payloads legitimately run long;
# readability there matters more than the 100-col limit applied to src/.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
