services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fxpulse
      POSTGRES_PASSWORD: fxpulse
      POSTGRES_DB: fxpulse
    ports:
      - "5432:5432"
    volumes:
      - fxpulse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fxpulse-data:
